[package]
name = "equant"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "AI-first pure Rust batch quantitative finance and technical analysis operators"
license = "MIT"
repository = "https://github.com/xingwudao/equant-rs"
documentation = "https://docs.rs/equant"
readme = "README.md"
keywords = ["quantitative", "finance", "trading", "indicators", "technical-analysis"]
categories = ["finance", "algorithms", "mathematics"]

[lib]
name = "equant"
path = "src/lib.rs"

[dev-dependencies]
approx = "0.5"
proptest = "=1.5.0"
criterion = "0.5"
serde_json = "1"
# Criterion accepts newer Clap releases whose manifests require Edition 2024.
# Pin the development CLI parser so the declared Rust 1.81 MSRV can parse it.
clap = "=4.5.48"
# Proptest accepts newer Tempfile releases with the same MSRV issue.
tempfile = "=3.12.0"

[[bench]]
name = "operators"
harness = false
